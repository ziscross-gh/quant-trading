[package]
name = "gold-quant-trading"
version = "1.0.0"
edition = "2021"
authors = ["Autonomous Trading Team"]
description = "Autonomous quantitative trading system for Gold/USD written in Rust"
license = "MIT"
repository = "https://github.com/yourusername/quant-trading"
keywords = ["trading", "quantitative", "gold", "forex", "algorithmic-trading"]
categories = ["finance"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Data structures and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client for data fetching
reqwest = { version = "0.11", features = ["json"] }

# Data manipulation (pandas-like)
polars = { version = "0.36", features = ["lazy", "temporal", "strings", "dtype-date"] }
ndarray = "0.15"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration management
config = "0.13"
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
ctrlc = "3.4"

# Statistics and math
statrs = "0.16"
nalgebra = "0.32"

# CSV handling
csv = "1.3"

# Scheduling
tokio-cron-scheduler = "0.9"

# Environment variables
envy = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Web framework (for dashboard)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }

# Telegram bot
teloxide = { version = "0.12", features = ["macros"] }

# Email
lettre = "0.11"

# Additional math/stats
rand = "0.8"

[dev-dependencies]
criterion = "0.5"
mockito = "1.2"
tokio-test = "0.4"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "trade"
path = "src/bin/trade.rs"

[[bench]]
name = "strategy_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
opt-level = 3
